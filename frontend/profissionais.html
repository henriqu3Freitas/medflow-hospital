<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profissionais | MedFlow</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container-principal"><nav class="menu-lateral"><h2 class="logo">MedFlow 🏥</h2><ul class="lista-menu">
<li><a href="index.html" data-pagina="dashboard">📊 Dashboard</a></li><li><a href="pacientes.html" data-pagina="pacientes">👤 Pacientes</a></li><li><a href="profissionais.html" data-pagina="profissionais">⚕️ Profissionais</a></li><li><a href="consultas.html" data-pagina="consultas">📅 Consultas</a></li><li><a href="internacoes.html" data-pagina="internacoes">🛏️ Internações e Quartos</a></li></ul></nav>
<main class="conteudo"><div class="barra-cabecalho"><h1>Profissionais da saúde</h1></div><div id="mensagem" class="mensagem"></div>
<form id="formulario" class="formulario"><h2>Cadastrar profissional</h2><div class="campo-grupo"><label>Nome completo</label><input id="nome" class="campo" required></div><div class="campo-grupo"><label>Registro profissional</label><input id="registro" class="campo" placeholder="CRM, por exemplo" required></div>
<div class="campo-grupo"><label>Telefone</label><input id="telefone" class="campo"></div><div class="campo-grupo"><label>E-mail</label><input id="email" type="email" class="campo"></div><div class="campo-grupo"><label>Categoria</label><select id="tipo"><option value="CLINICO_GERAL">Médico clínico geral</option><option value="ESPECIALISTA">Médico especialista</option><option value="CIRURGIAO">Cirurgião</option></select></div><div class="campo-grupo"><label>Especialidade</label><input id="especialidade" class="campo" placeholder="Obrigatória para especialista"></div><div class="campo-grupo"><label>Área cirúrgica</label><input id="area" class="campo" placeholder="Obrigatória para cirurgião"></div><div class="campo-grupo acoes"><button class="btn-principal">Salvar profissional</button><button type="reset" class="btn-secundario">Limpar</button></div></form>
<section class="caixa-tabela"><div class="barra-cabecalho"><h2>Profissionais cadastrados</h2><select id="filtro" class="campo filtro"><option value="">Todas as categorias</option><option value="CLINICO_GERAL">Clínico geral</option><option value="ESPECIALISTA">Especialista</option><option value="CIRURGIAO">Cirurgião</option></select></div><table class="tabela"><thead><tr><th>Nome</th><th>Registro</th><th>Categoria</th><th>Especialidade</th><th>Área cirúrgica</th></tr></thead><tbody id="lista"></tbody></table></section></main></div>
<script src="app.js"></script><script>menuAtivo('profissionais');let profissionais=[];
function nomeTipo(t){return {CLINICO_GERAL:'Clínico geral',ESPECIALISTA:'Especialista',CIRURGIAO:'Cirurgião'}[t]||t} function render(){const filtro=valor('filtro');preencherTabela('lista',profissionais.filter(p=>!filtro||p.tipo===filtro).map(p=>`<tr><td>${p.nome}</td><td>${p.registroProfissional}</td><td>${nomeTipo(p.tipo)}</td><td>${p.especialidade||'-'}</td><td>${p.areaCirurgica||'-'}</td></tr>`).join(''))}
async function carregar(){try{profissionais=await api('/profissionais');render()}catch(e){mostrarMensagem(e.message,'erro')}} document.querySelector('#filtro').addEventListener('change',render);document.querySelector('#formulario').addEventListener('submit',async e=>{e.preventDefault();try{await api('/profissionais',{method:'POST',body:JSON.stringify({nome:valor('nome'),registroProfissional:valor('registro'),telefone:valor('telefone'),email:valor('email'),tipo:valor('tipo'),especialidade:valor('especialidade'),areaCirurgica:valor('area')})});e.target.reset();mostrarMensagem('Profissional cadastrado com sucesso.');carregar()}catch(x){mostrarMensagem(x.message,'erro')}});carregar();</script></body></html>
