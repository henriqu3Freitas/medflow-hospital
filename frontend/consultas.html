<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Consultas | MedFlow</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container-principal"><nav class="menu-lateral"><h2 class="logo">MedFlow 🏥</h2><ul class="lista-menu">
<li><a href="index.html" data-pagina="dashboard">📊 Dashboard</a></li><li><a href="pacientes.html" data-pagina="pacientes">👤 Pacientes</a></li><li><a href="profissionais.html" data-pagina="profissionais">⚕️ Profissionais</a></li><li><a href="consultas.html" data-pagina="consultas">📅 Consultas</a></li><li><a href="internacoes.html" data-pagina="internacoes">🛏️ Internações e Quartos</a></li></ul></nav>
<main class="conteudo"><div class="barra-cabecalho"><h1>Consultas</h1></div><div id="mensagem" class="mensagem"></div>
<form id="formulario" class="formulario"><h2>Agendar consulta</h2><div class="campo-grupo"><label>Paciente</label><select id="paciente" required></select></div><div class="campo-grupo"><label>Profissional</label><select id="profissional" required></select></div><div class="campo-grupo"><label>Data e horário</label><input id="dataHora" type="datetime-local" class="campo" required></div><div class="campo-grupo"><label>Modalidade</label><select id="tipo"><option value="ROTINA">Consulta de rotina</option><option value="ESPECIALIZADA">Consulta especializada</option></select></div><div class="campo-grupo"><label>Especialidade (para especializada)</label><input id="especialidade" class="campo"></div><div class="campo-grupo"><label>Motivo</label><input id="motivo" class="campo" required></div><div class="campo-grupo acoes"><button class="btn-principal">Agendar consulta</button><button type="reset" class="btn-secundario">Limpar</button></div></form>
<section class="caixa-tabela"><div class="barra-cabecalho"><h2>Agenda</h2><select id="filtro" class="campo filtro"><option value="">Todos os status</option><option value="AGENDADA">Agendada</option><option value="CONFIRMADA">Confirmada</option><option value="EM_ATENDIMENTO">Em atendimento</option><option value="CONCLUIDA">Concluída</option><option value="CANCELADA">Cancelada</option><option value="NAO_COMPARECEU">Não compareceu</option></select></div><table class="tabela"><thead><tr><th>Data e horário</th><th>Paciente</th><th>Profissional</th><th>Modalidade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></section></main></div>
<script src="app.js"></script><script>menuAtivo('consultas');let pacientes=[],profissionais=[],consultas=[];
function nome(id,lista){return (lista.find(x=>x.id===id)||{}).nome||id} function statusLabel(s){return {AGENDADA:'Agendada',CONFIRMADA:'Confirmada',EM_ATENDIMENTO:'Em atendimento',CONCLUIDA:'Concluída',CANCELADA:'Cancelada',NAO_COMPARECEU:'Não compareceu'}[s]||s}
function render(){const filtro=valor('filtro');preencherTabela('lista',consultas.filter(c=>!filtro||c.status===filtro).map(c=>`<tr><td>${formatarData(c.dataHora)}</td><td>${nome(c.pacienteId,pacientes)}</td><td>${nome(c.profissionalId,profissionais)}</td><td>${c.tipo==='ESPECIALIZADA'?`Especializada - ${c.especialidade}`:'Rotina'}</td><td><span class="status status-${c.status.toLowerCase()}">${statusLabel(c.status)}</span></td><td>${c.status==='AGENDADA'?`<button class="btn" onclick="alterar('${c.id}','CONFIRMADA')">Confirmar</button>`:''}${c.status==='CONFIRMADA'?`<button class="btn" onclick="alterar('${c.id}','EM_ATENDIMENTO')">Iniciar</button>`:''}${c.status==='EM_ATENDIMENTO'?`<button class="btn" onclick="alterar('${c.id}','CONCLUIDA')">Concluir</button>`:''}</td></tr>`).join(''))}
async function carregar(){try{[pacientes,profissionais,consultas]=await Promise.all([api('/pacientes'),api('/profissionais'),api('/consultas')]);document.querySelector('#paciente').innerHTML=pacientes.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');document.querySelector('#profissional').innerHTML=profissionais.map(p=>`<option value="${p.id}">${p.nome} - ${p.especialidade||'Clínico geral'}</option>`).join('');render()}catch(e){mostrarMensagem(e.message,'erro')}} async function alterar(id,status){try{await api(`/consultas/${id}/status?status=${status}`,{method:'PATCH'});mostrarMensagem('Status da consulta atualizado.');carregar()}catch(e){mostrarMensagem(e.message,'erro')}} document.querySelector('#filtro').addEventListener('change',render);document.querySelector('#formulario').addEventListener('submit',async e=>{e.preventDefault();try{await api('/consultas',{method:'POST',body:JSON.stringify({pacienteId:valor('paciente'),profissionalId:valor('profissional'),dataHora:valor('dataHora'),tipo:valor('tipo'),especialidade:valor('especialidade')||null,motivo:valor('motivo')})});e.target.reset();mostrarMensagem('Consulta agendada com sucesso.');carregar()}catch(x){mostrarMensagem(x.message,'erro')}});carregar();</script></body></html>
