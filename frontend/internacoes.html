<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Internações e Quartos | MedFlow</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container-principal"><nav class="menu-lateral"><h2 class="logo">MedFlow 🏥</h2><ul class="lista-menu">
<li><a href="index.html" data-pagina="dashboard">📊 Dashboard</a></li><li><a href="pacientes.html" data-pagina="pacientes">👤 Pacientes</a></li><li><a href="profissionais.html" data-pagina="profissionais">⚕️ Profissionais</a></li><li><a href="consultas.html" data-pagina="consultas">📅 Consultas</a></li><li><a href="internacoes.html" data-pagina="internacoes">🛏️ Internações e Quartos</a></li></ul></nav>
<main class="conteudo"><div class="barra-cabecalho"><h1>Internações e quartos</h1></div><div id="mensagem" class="mensagem"></div>
<div class="formulario"><h2>Nova internação</h2><div class="campo-grupo"><label>Paciente</label><select id="paciente" required></select></div><div class="campo-grupo"><label>Quarto disponível</label><select id="quarto" required></select></div><div class="campo-grupo"><label>Motivo</label><input id="motivo" class="campo"></div><div class="campo-grupo acoes"><button class="btn-principal" onclick="internar()">Registrar internação</button></div></div>
<section class="caixa-tabela"><h2>Quartos</h2><table class="tabela"><thead><tr><th>Número</th><th>Tipo</th><th>Status</th><th>Ação</th></tr></thead><tbody id="quartos"></tbody></table></section>
<section class="caixa-tabela" style="margin-top:22px"><h2>Internações ativas</h2><table class="tabela"><thead><tr><th>Paciente</th><th>Quarto</th><th>Entrada</th><th>Motivo</th><th>Ação</th></tr></thead><tbody id="internacoes"></tbody></table></section></main></div>
<script src="app.js"></script><script>menuAtivo('internacoes');let pacientes=[],quartos=[],internacoes=[];
function nome(id,lista){return (lista.find(x=>x.id===id)||{}).nome||id}function quarto(id){return (quartos.find(x=>x.id===id)||{}).numero||id}function tipo(t){return {ENFERMARIA:'Enfermaria',PRIVATIVO:'Privativo',UTI:'UTI'}[t]||t}
function render(){document.querySelector('#quarto').innerHTML=quartos.filter(q=>q.disponivel).map(q=>`<option value="${q.id}">${q.numero} - ${tipo(q.tipo)}</option>`).join('');preencherTabela('quartos',quartos.map(q=>`<tr><td>${q.numero}</td><td>${tipo(q.tipo)}</td><td><span class="status ${q.disponivel?'status-concluida':'status-cancelada'}">${q.disponivel?'Disponível':'Ocupado'}</span></td><td><button class="btn" onclick="alternarQuarto('${q.id}',${!q.disponivel})">${q.disponivel?'Bloquear':'Liberar'}</button></td></tr>`).join(''));preencherTabela('internacoes',internacoes.filter(i=>i.ativa).map(i=>`<tr><td>${nome(i.pacienteId,pacientes)}</td><td>${quarto(i.quartoId)}</td><td>${formatarData(i.entrada)}</td><td>${i.motivo||'-'}</td><td><button class="btn-perigo" onclick="alta('${i.id}')">Dar alta</button></td></tr>`).join(''),'Nenhuma internação ativa.')}
async function carregar(){try{[pacientes,quartos,internacoes]=await Promise.all([api('/pacientes'),api('/quartos'),api('/internacoes')]);document.querySelector('#paciente').innerHTML=pacientes.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');render()}catch(e){mostrarMensagem(e.message,'erro')}}async function internar(){try{await api('/internacoes',{method:'POST',body:JSON.stringify({pacienteId:valor('paciente'),quartoId:valor('quarto'),motivo:valor('motivo')})});mostrarMensagem('Internação registrada.');carregar()}catch(e){mostrarMensagem(e.message,'erro')}}async function alta(id){try{await api(`/internacoes/${id}/alta`,{method:'PATCH'});mostrarMensagem('Alta registrada e quarto liberado.');carregar()}catch(e){mostrarMensagem(e.message,'erro')}}async function alternarQuarto(id,disponivel){try{await api(`/quartos/${id}/disponibilidade?disponivel=${disponivel}`,{method:'PATCH'});carregar()}catch(e){mostrarMensagem(e.message,'erro')}}carregar();</script></body></html>
